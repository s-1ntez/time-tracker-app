name: Build macOS App

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "**"

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri (macOS)
        run: npm run tauri:build:ci
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Zip macOS app bundle
        run: |
          cd src-tauri/target/release/bundle/macos
          ditto -c -k --sequesterRsrc --keepParent "Time Tracker.app" "Time Tracker_macOS.zip"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: time-tracker-macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload macOS ZIP
        uses: actions/upload-artifact@v4
        with:
          name: time-tracker-macos-app
          path: src-tauri/target/release/bundle/macos/*.zip
          if-no-files-found: error

name: Build macOS App
# Trigger note: keep this workflow path hot for desktop rebuilds.

on:
  workflow_dispatch:

concurrency:
  group: macos-build
  cancel-in-progress: false

jobs:
  build-macos:
    runs-on: macos-13

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri (macOS)
        run: npm run tauri:build:mac:x64:ci
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Verify macOS app metadata
        run: |
          APP="src-tauri/target/x86_64-apple-darwin/release/bundle/macos/Time Tracker.app"
          PLIST="$APP/Contents/Info.plist"
          BIN="$APP/Contents/MacOS/Time Tracker"
          /usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$PLIST" | tee /tmp/min_version.txt
          test "$(/usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$PLIST")" = "12.0"
          file "$BIN" | tee /tmp/bin_arch.txt
          file "$BIN" | grep "x86_64"

      - name: Zip macOS app bundle
        run: |
          cd src-tauri/target/x86_64-apple-darwin/release/bundle/macos
          ditto -c -k --sequesterRsrc --keepParent "Time Tracker.app" "Time Tracker_macOS.zip"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: time-tracker-macos-dmg
          path: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*_x64.dmg
          if-no-files-found: error

      - name: Upload macOS ZIP
        uses: actions/upload-artifact@v4
        with:
          name: time-tracker-macos-app
          path: src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.zip
          if-no-files-found: error

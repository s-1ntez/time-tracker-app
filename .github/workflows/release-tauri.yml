name: Release Tauri App

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15-intel
            args: "--target x86_64-apple-darwin"
            rust_targets: "x86_64-apple-darwin"
          - platform: windows-latest
            args: "--target x86_64-pc-windows-msvc"
            rust_targets: "x86_64-pc-windows-msvc"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install frontend deps
        run: npm ci

      - name: Normalize updater signing key
        shell: bash
        env:
          RAW_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RAW_TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$RAW_TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
            echo "Missing TAURI_SIGNING_PRIVATE_KEY_PASSWORD" >&2
            exit 1
          fi

          if [ -z "$RAW_TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "Missing TAURI_SIGNING_PRIVATE_KEY" >&2
            exit 1
          fi

          NORMALIZED_KEY="$(python3 -c "import base64, os, sys; raw=os.environ['RAW_TAURI_SIGNING_PRIVATE_KEY'].strip(); decoded = base64.b64decode(raw).decode('utf-8') if not raw.startswith('untrusted comment:') else raw; sys.exit('Invalid updater private key format') if not decoded.startswith('untrusted comment:') else None; sys.stdout.write(base64.b64encode(decoded.encode('utf-8')).decode('ascii'))")" || {
            echo "Invalid updater private key format" >&2
            exit 1
          }

          {
            echo "TAURI_SIGNING_PRIVATE_KEY=$NORMALIZED_KEY"
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$RAW_TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Create GitHub Release and updater artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Time Tracker ${{ github.ref_name }}"
          releaseBody: "Desktop release for Time Tracker."
          releaseDraft: false
          prerelease: false
          tauriScript: npx tauri
          args: ${{ matrix.args }}
